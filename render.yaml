# Render Blueprint — deploys the entire Trello SaaS stack.
# Reference: https://render.com/docs/blueprint-spec
#
# Creates three resources on the free tier:
#   1. trello-db        — Render Postgres (1 GB, expires 30 days after creation)
#   2. trello-backend   — Node/Express API + Socket.IO (spins down when idle)
#   3. trello-frontend  — Vite static site (static sites are always free)
#
# The backend applies Database/schema.sql on boot, so no manual migration step
# is required (free instances have no shell access).

databases:
  - name: trello-db
    databaseName: trello_saas
    user: trello_user
    plan: free
    postgresMajorVersion: "16"

services:
  # =====================
  # Backend — Node.js Web Service
  # =====================
  - type: web
    name: trello-backend
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: trello-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Optional integrations (Stripe, SendGrid, Sentry, ...) are intentionally
      # NOT declared here so the Blueprint applies with zero input. Add them as
      # environment variables in the Render dashboard when you need them:
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SENDGRID_API_KEY, SENTRY_DSN.
      - key: EMAIL_FROM
        value: noreply@trello-clone.com
      # Public URL of the static site below — used for CORS, Socket.IO and the
      # links inside transactional emails.
      - key: CLIENT_URL
        fromService:
          name: trello-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGIN
        fromService:
          name: trello-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # =====================
  # Frontend — Static Site
  # =====================
  - type: web
    name: trello-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    # SPA fallback — every client-side route is served by index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # RENDER_EXTERNAL_URL resolves to https://<backend-host>; the SPA appends
      # the `/api` prefix itself (see src/lib/api-url.ts).
      - key: VITE_API_URL
        fromService:
          name: trello-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_SOCKET_URL
        fromService:
          name: trello-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
